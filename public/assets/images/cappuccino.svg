<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="capCup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="latteArt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#efebe9"/>
      <stop offset="85%" stop-color="#795548"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
  </defs>
  <!-- Saucer plate -->
  <ellipse cx="50" cy="138" rx="42" ry="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="50" cy="136" rx="34" ry="8" fill="#ffffff"/>
  <!-- Cup Handle -->
  <path d="M 72 70 C 90 70 90 106 70 106" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <path d="M 72 70 C 88 70 88 106 70 106" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Ceramic Cup Body -->
  <path d="M 22 55 L 28 116 Q 30 134 50 134 Q 70 134 72 116 L 78 55 Z" fill="url(#capCup)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Foamy top surface with latte art heart -->
