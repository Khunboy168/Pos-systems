  <!-- Latte Art Heart -->
  <path d="M 50 58 Q 42 48 38 53 Q 34 58 45 64 L 50 67 L 55 64 Q 66 58 62 53 Q 58 48 50 58 Z" fill="#ffffff"/>
  <!-- Warm Steam waves -->
  <path d="M 40 38 Q 44 26 40 16" fill="none" stroke="#d7ccc8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 50 35 Q 54 22 50 12" fill="none" stroke="#d7ccc8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 60 38 Q 64 26 60 16" fill="none" stroke="#d7ccc8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <text x="50" y="102" font-family="'Times New Roman', serif" font-size="7" font-weight="bold" fill="#5d4037" text-anchor="middle">CAPPUCCINO</text>
</svg>
