<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="toastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="50%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Plate -->
  <ellipse cx="50" cy="115" rx="46" ry="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Sandwich Pick Toothpick -->
  <line x1="50" y1="35" x2="50" y2="80" stroke="#8d6e63" stroke-width="3"/>
  <circle cx="50" cy="34" r="5" fill="#e53935"/>
  <!-- Triple decker triangular cut sandwich -->
  <!-- Top Bread Slice -->
  <polygon points="20,70 80,70 50,45" fill="url(#toastGrad)" stroke="#e65100" stroke-width="1.5"/>
  <!-- Filling: Lettuce, Tomato, Cheese, Chicken -->
  <polygon points="21,74 79,74 50,50" fill="#4caf50"/>
  <polygon points="22,78 78,78 50,54" fill="#e53935"/>
  <polygon points="23,82 77,82 50,58" fill="#ffc107"/>
  <!-- Middle Bread Slice -->
  <polygon points="22,86 78,86 50,62" fill="#ffe0b2"/>
  <polygon points="23,90 77,90 50,66" fill="#8d6e63"/>
  <polygon points="24,94 76,94 50,70" fill="#4caf50"/>
  <!-- Bottom Bread Slice -->
  <polygon points="23,98 77,98 50,74" fill="url(#toastGrad)" stroke="#e65100" stroke-width="1.5"/>
  <!-- French Fries on side -->
  <rect x="24" y="104" width="22" height="4" rx="2" fill="#fbc02d" transform="rotate(-15 24 104)"/>
  <rect x="30" y="108" width="22" height="4" rx="2" fill="#fbc02d" transform="rotate(-5 30 108)"/>
  <rect x="65" y="104" width="20" height="4" rx="2" fill="#fbc02d" transform="rotate(20 65 104)"/>
  <text x="50" y="145" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#5d4037" text-anchor="middle">CLUB SANDWICH</text>
</svg>
