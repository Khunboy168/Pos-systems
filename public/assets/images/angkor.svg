<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="angkorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="35%" stop-color="#e53935"/>
      <stop offset="70%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#8e0000"/>
    </linearGradient>
    <linearGradient id="angkorWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="canRimA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
  </defs>
  <!-- Top rim -->
  <ellipse cx="50" cy="18" rx="36" ry="9" fill="url(#canRimA)"/>
  <ellipse cx="50" cy="18" rx="28" ry="6" fill="#78909c"/>
  <!-- Body Top Half White, Lower Half Red -->
  <path d="M 14 18 Q 14 26 16 32 L 16 142 Q 16 148 20 152 L 80 152 Q 84 148 84 142 L 84 32 Q 86 26 86 18 Z" fill="url(#angkorGrad)"/>
  <!-- Top white band -->
  <rect x="16" y="30" width="68" height="42" fill="url(#angkorWhite)"/>
  <!-- Gold line -->
  <line x1="16" y1="72" x2="84" y2="72" stroke="#fbc02d" stroke-width="2"/>
  <!-- Angkor Wat silhouette icon -->
  <path d="M 40 54 L 43 45 L 46 54 L 48 40 L 52 40 L 54 54 L 57 45 L 60 54 Z" fill="#b71c1c"/>
  <text x="50" y="66" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#c62828" text-anchor="middle" letter-spacing="1">ANGKOR</text>
  <!-- Red section text -->
  <text x="50" y="92" font-family="'Times New Roman', serif" font-size="12" font-style="italic" font-weight="bold" fill="#ffffff" text-anchor="middle">Premium</text>
  <text x="50" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#fbc02d" text-anchor="middle" letter-spacing="2">BEER</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="6" fill="#ffffff" text-anchor="middle" letter-spacing="1">MY COUNTRY, MY BEER</text>
  <!-- Bottom rim -->
  <ellipse cx="50" cy="150" rx="30" ry="5" fill="url(#canRimA)" opacity="0.8"/>
</svg>
