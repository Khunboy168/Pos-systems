<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <radialGradient id="riceMound" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="60%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </radialGradient>
  </defs>
  <!-- Ceramic Round Plate -->
  <ellipse cx="50" cy="95" rx="46" ry="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="50" cy="95" rx="38" ry="30" fill="#f8fafc"/>
  <!-- Fried Rice mound -->
  <ellipse cx="50" cy="94" rx="30" ry="22" fill="url(#riceMound)"/>
  <!-- Rice grains & chopped scallions/carrots -->
  <circle cx="36" cy="90" r="1.5" fill="#4caf50"/>
  <circle cx="44" cy="85" r="1.5" fill="#ff7043"/>
  <circle cx="58" cy="92" r="1.5" fill="#4caf50"/>
  <circle cx="62" cy="88" r="1.5" fill="#ff7043"/>
  <circle cx="40" cy="102" r="1.5" fill="#ff7043"/>
  <circle cx="56" cy="104" r="1.5" fill="#4caf50"/>
  <!-- Sunny Side Up Egg on top -->
  <ellipse cx="50" cy="88" rx="14" ry="11" fill="#ffffff" stroke="#fff9c4" stroke-width="1.5"/>
  <circle cx="50" cy="88" r="5.5" fill="#ff9800"/>
  <!-- Cucumber slices on side -->
  <ellipse cx="26" cy="96" rx="6" ry="4" fill="#a5d6a7" stroke="#4caf50" stroke-width="1" transform="rotate(-20 26 96)"/>
  <ellipse cx="28" cy="104" rx="6" ry="4" fill="#a5d6a7" stroke="#4caf50" stroke-width="1" transform="rotate(-10 28 104)"/>
  <text x="50" y="148" font-family="'Arial Black', sans-serif" font-size="7" font-weight="900" fill="#3e2723" text-anchor="middle">KHMER FRIED RICE</text>
</svg>
