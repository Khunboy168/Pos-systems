<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <radialGradient id="coconutSkin" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="60%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
  </defs>
  <!-- Straw -->
  <line x1="62" y1="12" x2="48" y2="90" stroke="#ff1744" stroke-width="5" stroke-linecap="round"/>
  <!-- Green Cut Coconut Body -->
  <path d="M 22 75 Q 15 110 32 135 Q 50 148 68 135 Q 85 110 78 75 Q 70 65 50 65 Q 30 65 22 75 Z" fill="url(#coconutSkin)" stroke="#1b5e20" stroke-width="2"/>
  <!-- Diamond faceted trimmed husk top -->
  <polygon points="50,45 68,66 50,75 32,66" fill="#fff9c4" stroke="#e0e0e0" stroke-width="1.5"/>
  <ellipse cx="50" cy="72" rx="16" ry="8" fill="#ffffff" stroke="#c8e6c9" stroke-width="1.5"/>
  <!-- Coconut water inside opening -->
  <ellipse cx="50" cy="72" rx="12" ry="6" fill="#e1f5fe"/>
  <!-- Frangipani / Plumeria tropical flower -->
  <circle cx="68" cy="62" r="5" fill="#fbc02d"/>
  <circle cx="68" cy="62" r="3" fill="#ffffff"/>
  <text x="50" y="152" font-family="'Arial Black', sans-serif" font-size="7" font-weight="900" fill="#1b5e20" text-anchor="middle">FRESH COCONUT</text>
</svg>
