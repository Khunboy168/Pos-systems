<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="abcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="35%" stop-color="#2a2a2a"/>
      <stop offset="70%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
  </defs>
  <!-- Top rim -->
  <ellipse cx="50" cy="18" rx="36" ry="9" fill="url(#metalRim)"/>
  <ellipse cx="50" cy="18" rx="28" ry="6" fill="#455a64"/>
  <!-- Body -->
  <path d="M 14 18 Q 14 26 16 32 L 16 142 Q 16 148 20 152 L 80 152 Q 84 148 84 142 L 84 32 Q 86 26 86 18 Z" fill="url(#abcGrad)"/>
  <!-- Gold Shield Badge -->
  <rect x="25" y="42" width="50" height="60" rx="4" fill="#000000" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="50" y="65" font-family="'Times New Roman', serif" font-size="20" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">ABC</text>
  <line x1="30" y1="72" x2="70" y2="72" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="50" y="84" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">EXTRA STOUT</text>
  <text x="50" y="94" font-family="Arial, sans-serif" font-size="5" fill="url(#goldGrad)" text-anchor="middle">SINCE 1931</text>
  <!-- Bottom rim -->
  <ellipse cx="50" cy="150" rx="30" ry="5" fill="url(#metalRim)" opacity="0.8"/>
</svg>
