<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <defs>
    <linearGradient id="waterCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="50%" stop-color="#42a5f5"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="waterBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e1f5fe"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0277bd"/>
      <stop offset="50%" stop-color="#039be5"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
  </defs>
  <!-- Cap -->
  <rect x="42" y="8" width="16" height="10" rx="2" fill="url(#waterCap)"/>
  <rect x="40" y="16" width="20" height="4" rx="1" fill="#0d47a1"/>
  <!-- Bottle Neck -->
  <path d="M 44 20 L 44 32 Q 30 40 28 55 L 28 145 Q 28 152 36 154 L 64 154 Q 72 152 72 145 L 72 55 Q 70 40 56 32 L 56 20 Z" fill="url(#waterBottle)" opacity="0.9" stroke="#90caf9" stroke-width="1.5"/>
  <!-- Bottle ridges -->
  <line x1="30" y1="62" x2="70" y2="62" stroke="#81d4fa" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="126" x2="70" y2="126" stroke="#81d4fa" stroke-width="1.5" opacity="0.6"/>
  <!-- Blue Label -->
  <rect x="28" y="72" width="44" height="44" fill="url(#labelGrad)"/>
  <circle cx="50" cy="85" r="8" fill="#ffffff" opacity="0.2"/>
  <text x="50" y="88" font-family="'Trebuchet MS', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">CAMBODIA</text>
  <text x="50" y="98" font-family="Arial, sans-serif" font-size="6" font-weight="900" fill="#e0f7fa" text-anchor="middle" letter-spacing="1">WATER</text>
  <text x="50" y="108" font-family="Arial, sans-serif" font-size="4" fill="#bbdefb" text-anchor="middle">500 ml • PURE</text>
  <!-- Water shine -->
  <rect x="32" y="52" width="4" height="90" rx="2" fill="#ffffff" opacity="0.5"/>
</svg>
